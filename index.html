<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Online Organic Food System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500&display=swap">
<style>
/* Layout: market-stall storefront. Sticky header with tabs, label-style product tiles in a grid, slide-in cart, admin tables. */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'DM Sans','Hind Siliguri','Segoe UI',system-ui,sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,monospace;
  --bg:#f2f6ef; --surface:#ffffff; --ink:#142619; --muted:#58695d; --line:#d8e2d6;
  --accent:#1d6b3f; --accent-ink:#ffffff; --accent-soft:#dcebd9;
  --sticker:#f2b705; --sticker-ink:#2a2100;
  --good:#1d7a45; --good-bg:#dcf0e2; --warn:#8f5600; --warn-bg:#fbebcb; --bad:#b3261e; --bad-bg:#f9dedb;
  --shadow:0 1px 2px rgba(20,38,25,.06),0 10px 30px rgba(20,38,25,.10);
  --scrim:rgba(10,20,14,.5);
  --t0:#dcebd5; --i0:#2c5a35; --t1:#f6dcc9; --i1:#8a3f1c; --t2:#efe3bd; --i2:#7a5f12; --t3:#e3ecf0; --i3:#2f5666; --t4:#f3e2a8; --i4:#7a5600;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a13; --surface:#15241b; --ink:#e5efe7; --muted:#9bb0a1; --line:#27392d;
    --accent:#5fc58a; --accent-ink:#06210f; --accent-soft:#1d3a29;
    --good:#7ad9a0; --good-bg:#17382a; --warn:#f0c26a; --warn-bg:#3a2e12; --bad:#ff9b92; --bad-bg:#3e1f1c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
    --scrim:rgba(0,0,0,.6);
    --t0:#1d3324; --i0:#9fd0a8; --t1:#3a2619; --i1:#f0b08a; --t2:#35300f; --i2:#e0c872; --t3:#1c2f38; --i3:#9cc6d6; --t4:#3a2e0a; --i4:#efc660;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a13; --surface:#15241b; --ink:#e5efe7; --muted:#9bb0a1; --line:#27392d;
  --accent:#5fc58a; --accent-ink:#06210f; --accent-soft:#1d3a29;
  --good:#7ad9a0; --good-bg:#17382a; --warn:#f0c26a; --warn-bg:#3a2e12; --bad:#ff9b92; --bad-bg:#3e1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.6);
  --t0:#1d3324; --i0:#9fd0a8; --t1:#3a2619; --i1:#f0b08a; --t2:#35300f; --i2:#e0c872; --t3:#1c2f38; --i3:#9cc6d6; --t4:#3a2e0a; --i4:#efc660;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.bn{font-family:'Hind Siliguri',var(--font-body);font-weight:400;color:var(--muted);font-size:.85em;white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:1.1rem;letter-spacing:-.01em;background:none;border:0;padding:0;text-align:left}
.brand svg{flex:none}
.tabs{display:flex;gap:4px;order:3;flex:1 1 100%;overflow-x:auto;min-width:0}
.tab{background:none;border:0;border-radius:8px;padding:7px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--accent-soft)}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.actions{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0}
.hello{font-size:.88rem;color:var(--muted);max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:760px){.tabs{order:0;flex:0 1 auto}}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 14px;font-weight:600;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{background:var(--sticker);color:var(--sticker-ink);border-radius:99px;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center;font-size:.75rem;font-weight:700}
.field{display:grid;gap:5px;min-width:0}
.field label,.label{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=search],select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
textarea{resize:vertical;min-height:70px}
.form{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em}

/* shop */
main{padding-block:22px 40px}
.intro{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:end;justify-content:space-between;margin-bottom:18px}
.intro h1{font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:800;letter-spacing:-.02em;max-width:22ch}
.intro p{color:var(--muted);max-width:44ch}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1 1 220px;min-width:0}
.toolbar select{width:auto;flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-weight:500;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.count{font-size:.85rem;color:var(--muted);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tile{position:relative;height:104px;display:grid;place-items:center;background:var(--tile);color:var(--tile-ink)}
.tile svg{width:56px;height:56px}
.cat-0{--tile:var(--t0);--tile-ink:var(--i0)}.cat-1{--tile:var(--t1);--tile-ink:var(--i1)}.cat-2{--tile:var(--t2);--tile-ink:var(--i2)}.cat-3{--tile:var(--t3);--tile-ink:var(--i3)}.cat-4{--tile:var(--t4);--tile-ink:var(--i4)}
.sticker{position:absolute;top:8px;right:8px;background:var(--sticker);color:var(--sticker-ink);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;text-align:center;font-family:var(--font-mono);font-size:.55rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;transform:rotate(8deg);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.cbody{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.cbody h3{font-size:1rem;font-weight:700;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.meta{font-size:.8rem;color:var(--muted)}
.buy{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-top:6px}
.price strong{font-family:var(--font-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.price span{font-size:.8rem;color:var(--muted);margin-left:3px}
.stock{font-size:.78rem;font-weight:600}
.stock.warn{color:var(--warn)}.stock.bad{color:var(--bad)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--accent);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:var(--accent-soft);color:var(--accent);width:32px;height:32px;font-size:1.1rem;font-weight:700}
.stepper span{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem}
.empty{border:1px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:1.15rem}

/* drawer + modal */
.layer{position:fixed;inset:0;z-index:40;display:flex}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;margin-left:auto;width:min(420px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column}
.panel header,.dialog header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel header h2,.dialog header h2{font-size:1.2rem}
.panel .body{flex:1;overflow-y:auto;padding:12px 16px;display:grid;gap:12px;align-content:start}
.panel footer{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:10px}
.dialog{position:relative;margin:auto;width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);overflow-y:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.dialog .body{padding:16px;display:grid;gap:14px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line b{font-weight:600}
.sum{display:grid;gap:4px;font-size:.92rem}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .total{font-family:var(--font-display);font-size:1.25rem;font-weight:700;padding-top:6px;border-top:1px solid var(--line)}
.hint{font-size:.85rem;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.85rem}
.seg{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.radio input{margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* orders */
.orders{display:grid;gap:14px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.ohead{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:baseline}
.ohead h3{font-size:1.05rem}
.items{display:grid;gap:4px;font-size:.92rem}
.items div{display:flex;justify-content:space-between;gap:12px}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.flow li{list-style:none;font-size:.72rem;font-weight:600;color:var(--muted);display:grid;gap:6px;text-align:center;min-width:0}
.flow li::before{content:"";height:6px;border-radius:99px;background:var(--line)}
.flow li.done{color:var(--ink)}.flow li.done::before{background:var(--accent)}
ul.flow{margin:0;padding:0}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.good{background:var(--good-bg);color:var(--good)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.tag{font-family:var(--font-mono);font-size:.68rem;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* admin */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .k{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-family:var(--font-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.box h3{font-size:1.05rem}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:.85rem}
.bar i{display:block;height:10px;border-radius:99px;background:var(--accent)}
.bar .trk{background:var(--accent-soft);border-radius:99px}
.bar.cancelled i{background:var(--bad)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td select{width:auto;padding:5px 8px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pagehead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.pagehead h2{font-size:1.5rem}
.foot{border-top:1px solid var(--line);padding-block:20px;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}}
</style>
</head>
<body>

<header class="top" id="top"></header>
<main class="wrap" id="main"></main>
<footer class="foot"><div class="wrap">Front-end demo of the Online Organic Food System by Sohan Rana. Accounts, carts and orders are stored in this browser only. Payments are not processed.</div></footer>
<div id="drawer" class="layer" hidden></div>
<div id="modal" class="layer" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var KEY='organic-food-system-demo-v1';
var CATS=['Vegetables','Fruits','Grains & pulses','Dairy & eggs','Honey & oils'];
var FLOW=['Pending','Confirmed','Packed','Out for delivery','Delivered'];
var ICONS=[
 '<path d="M12 52C12 28 28 12 54 10c0 26-14 42-38 42"/><path d="M12 52L38 26"/>',
 '<circle cx="32" cy="38" r="18"/><path d="M32 20c0-6 3-10 8-12"/><path d="M32 22c-6-4-12-2-14 2"/>',
 '<path d="M32 58V14"/><ellipse cx="25" cy="24" rx="5" ry="9" transform="rotate(-25 25 24)"/><ellipse cx="39" cy="24" rx="5" ry="9" transform="rotate(25 39 24)"/><ellipse cx="25" cy="42" rx="5" ry="9" transform="rotate(-25 25 42)"/><ellipse cx="39" cy="42" rx="5" ry="9" transform="rotate(25 39 42)"/>',
 '<path d="M32 8c10 0 18 18 18 30a18 18 0 0 1-36 0C14 26 22 8 32 8z"/>',
 '<rect x="16" y="22" width="32" height="34" rx="6"/><path d="M20 22v-7h24v7"/><path d="M16 36h32"/>'
];

function seed(){
  var P=[
    ['Tomato','টমেটো',0,90,'kg',60,'Jashore',1],['Spinach','পালং শাক',0,60,'kg',35,'Gazipur',0],
    ['Pumpkin','মিষ্টি কুমড়া',0,55,'kg',80,'Bogura',3],['Eggplant','বেগুন',0,80,'kg',45,'Jashore',1],
    ['Green chilli','কাঁচা মরিচ',0,160,'kg',9,'Bogura',2],['Carrot','গাজর',0,100,'kg',50,'Munshiganj',2],
    ['Banana','কলা',1,120,'dozen',40,'Narsingdi',1],['Guava','পেয়ারা',1,130,'kg',28,'Barishal',1],
    ['Papaya','পেঁপে',1,70,'kg',33,'Rajshahi',2],['Lemon','লেবু',1,220,'kg',0,'Sylhet',2],
    ['Chinigura rice','চিনিগুঁড়া চাল',2,150,'kg',200,'Dinajpur',20],['Red lentil','মসুর ডাল',2,140,'kg',90,'Pabna',30],
    ['Chickpea','ছোলা',2,125,'kg',70,'Faridpur',30],['Free-range eggs','দেশি ডিম',3,180,'dozen',24,'Savar',1],
    ['Fresh cow milk','গরুর দুধ',3,110,'litre',30,'Sirajganj',0],['Ghee','ঘি',3,1100,'kg',12,'Sirajganj',14],
    ['Cold-pressed mustard oil','সরিষার তেল',4,380,'litre',40,'Manikganj',10],['Sundarbans honey','সুন্দরবনের মধু',4,1200,'kg',8,'Khulna',12],
    ['Date molasses','খেজুরের গুড়',4,320,'kg',25,'Jashore',5]
  ].map(function(r,i){return {id:'p'+(i+1),name:r[0],bn:r[1],cat:CATS[r[2]],price:r[3],unit:r[4],stock:r[5],origin:r[6],age:r[7]};});
  var users=[
    {id:'u1',name:'Admin',email:'admin@organicfood.demo',pass:'admin123',role:'admin',phone:'',address:''},
    {id:'u2',name:'Nusrat Jahan',email:'customer@organicfood.demo',pass:'customer123',role:'customer',phone:'01700000000',address:'House 12, Road 5, Dhanmondi, Dhaka'},
    {id:'u3',name:'Imran Hossain',email:'imran@organicfood.demo',pass:'customer123',role:'customer',phone:'01800000000',address:'Flat 4B, Zindabazar, Sylhet'}
  ];
  var S={users:users,products:P,orders:[],cart:[],session:null,nextOrder:1};
  function mk(uid,iso,status,lines,pay){
    var u=users.filter(function(x){return x.id===uid;})[0];
    var items=lines.map(function(l){var p=P.filter(function(x){return x.id===l[0];})[0];return {id:p.id,name:p.name,unit:p.unit,price:p.price,qty:l[1]};});
    var sub=items.reduce(function(a,i){return a+i.price*i.qty;},0), fee=sub>=1000?0:60;
    S.orders.push({id:'OF-'+String(S.nextOrder++).padStart(4,'0'),userId:uid,created:iso,status:status,items:items,sub:sub,fee:fee,total:sub+fee,pay:pay,name:u.name,phone:u.phone,address:u.address,note:'',sample:true});
  }
  mk('u2','2026-10-02T11:05:00+06:00','Delivered',[['p1',2],['p14',1],['p11',3]],'Cash on delivery');
  mk('u3','2026-10-05T16:40:00+06:00','Delivered',[['p18',1],['p19',1]],'bKash on delivery');
  mk('u2','2026-10-07T09:15:00+06:00','Out for delivery',[['p2',1],['p7',2],['p8',1.5]],'Cash on delivery');
  mk('u3','2026-10-08T19:30:00+06:00','Packed',[['p17',2],['p12',2]],'bKash on delivery');
  mk('u2','2026-10-09T12:10:00+06:00','Pending',[['p15',2],['p14',2]],'Cash on delivery');
  mk('u3','2026-10-09T21:00:00+06:00','Cancelled',[['p6',1]],'Cash on delivery');
  return S;
}
var S=null;
try{var raw=localStorage.getItem(KEY); if(raw) S=JSON.parse(raw);}catch(e){}
if(!S||!S.products||!S.users) S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

var view='shop', adminTab='overview', filt={cat:'All',q:'',sort:'featured'}, pendingDelete=null, afterLogin=null;
var $=function(s,r){return (r||document).querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return '৳'+Math.round(n).toLocaleString('en-US');}
function qtyFmt(q){return Number.isInteger(q)?String(q):q.toFixed(1);}
function fmtDate(iso){var d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function me(){return S.users.filter(function(u){return u.id===S.session;})[0]||null;}
function isAdmin(){var u=me();return !!u&&u.role==='admin';}
function prod(id){return S.products.filter(function(p){return p.id===id;})[0];}
function stepOf(p){return (p.unit==='kg'||p.unit==='litre')?0.5:1;}
function catIdx(c){return Math.max(0,CATS.indexOf(c));}
function cartQty(id){var l=S.cart.filter(function(c){return c.id===id;})[0];return l?l.qty:0;}
function cartCount(){return S.cart.length;}
function cartSub(){return S.cart.reduce(function(a,c){var p=prod(c.id);return a+(p?p.price*c.qty:0);},0);}
function feeFor(sub){return sub===0?0:(sub>=1000?0:60);}
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true;},2600);}
function pill(st){var c=st==='Delivered'?'good':st==='Cancelled'?'bad':st==='Pending'?'warn':'';return '<span class="pill '+c+'">'+esc(st)+'</span>';}

    '<div class="actions">'+(u?'<span class="hello">Hi, '+esc(u.name.split(' ')[0])+'</span><button class="btn small" data-act="logout">Log out</button>':'<button class="btn small" data-act="login">Log in</button>')+
    '<button class="btn primary" data-act="cart-open" aria-label="Open cart">Cart <span class="badge" id="cartBadge">'+cartCount()+'</span></button></div></div>';

/* shop */
function renderShop(){
  $('#main').innerHTML=
   '<div class="intro"><h1>Organic food from small farms, at your door</h1><p>Browse today\'s harvest, add it to your cart and track the order. Delivery ৳60, free over ৳1,000.</p></div>'+
   '<div class="toolbar"><div class="search"><input type="search" id="q" placeholder="Search tomato, মধু, Jashore…" aria-label="Search products" value="'+esc(filt.q)+'"></div>'+
   '<select id="sort" aria-label="Sort products"><option value="featured">Featured</option><option value="plh">Price: low to high</option><option value="phl">Price: high to low</option><option value="az">Name A to Z</option></select></div>'+
   '<div class="chips" role="group" aria-label="Categories">'+['All'].concat(CATS).map(function(c){return '<button class="chip" data-act="cat" data-id="'+esc(c)+'" aria-pressed="'+(filt.cat===c)+'">'+esc(c)+'</button>';}).join('')+'</div>'+
   '<p class="count" id="count"></p><div class="grid" id="grid"></div>';
  $('#sort').value=filt.sort;
  renderGrid();
}
function filtered(){
  var q=filt.q.trim().toLowerCase();
  var list=S.products.filter(function(p){
    if(filt.cat!=='All'&&p.cat!==filt.cat) return false;
    if(!q) return true;
    return (p.name+' '+p.bn+' '+p.origin+' '+p.cat).toLowerCase().indexOf(q)>-1;
  });
  if(filt.sort==='plh') list.sort(function(a,b){return a.price-b.price;});
  if(filt.sort==='phl') list.sort(function(a,b){return b.price-a.price;});
  if(filt.sort==='az') list.sort(function(a,b){return a.name.localeCompare(b.name);});
  return list;
}
function card(p){
  var n=cartQty(p.id), out=p.stock<=0, low=!out&&p.stock<=10, ci=catIdx(p.cat);
  var ctl=out?'<button class="btn small" disabled>Sold out</button>':
    (n>0?'<div class="stepper"><button data-act="dec" data-id="'+p.id+'" aria-label="Remove one">−</button><span>'+qtyFmt(n)+'</span><button data-act="inc" data-id="'+p.id+'" aria-label="Add one">+</button></div>':
    '<button class="btn small primary" data-act="inc" data-id="'+p.id+'">Add</button>');
  return '<article class="card"><div class="tile cat-'+ci+'"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[ci]+'</svg><span class="sticker">Or&shy;ganic</span></div>'+
   '<div class="cbody"><h3>'+esc(p.name)+' <span class="bn">'+esc(p.bn)+'</span></h3>'+
   '<p class="meta">'+esc(p.origin)+' · harvested '+(p.age===0?'today':p.age+(p.age===1?' day':' days')+' ago')+'</p>'+
   (out?'<p class="stock bad">Out of stock</p>':low?'<p class="stock warn">Only '+qtyFmt(p.stock)+' '+esc(p.unit)+' left</p>':'')+
   '<div class="buy"><div class="price"><strong>'+money(p.price)+'</strong><span>/ '+esc(p.unit)+'</span></div>'+ctl+'</div></div></article>';
}
function renderGrid(){
  var g=$('#grid'); if(!g) return;
  var list=filtered();
  $('#count').textContent=list.length+(list.length===1?' product':' products');
  g.innerHTML=list.length?list.map(card).join(''):'<div class="empty" style="grid-column:1/-1"><h3>Nothing matches that search</h3><p>Try another name or clear the category filter.</p><button class="btn" data-act="clear">Clear filters</button></div>';
}

/* cart */
function renderCart(){
  var d=$('#drawer'); if(d.hidden) return;
  var lines=S.cart.map(function(c){return {c:c,p:prod(c.id)};}).filter(function(x){return x.p;});
  var sub=cartSub(), fee=feeFor(sub);
  var body=lines.length?lines.map(function(x){
    return '<div class="line"><b>'+esc(x.p.name)+'</b><span class="mono">'+money(x.p.price*x.c.qty)+'</span>'+
    '<div class="stepper"><button data-act="dec" data-id="'+x.p.id+'" aria-label="Remove one">−</button><span>'+qtyFmt(x.c.qty)+' '+esc(x.p.unit)+'</span><button data-act="inc" data-id="'+x.p.id+'" aria-label="Add one">+</button></div>'+
    '<button class="btn small" data-act="rm" data-id="'+x.p.id+'">Remove</button></div>';}).join(''):
    '<div class="empty"><h3>Your cart is empty</h3><p>Add something fresh from today\'s harvest.</p><button class="btn primary" data-act="close-cart">Browse produce</button></div>';
  d.innerHTML='<div class="scrim" data-act="close-cart"></div><aside class="panel" role="dialog" aria-label="Cart"><header><h2>Your cart</h2><button class="btn small" data-act="close-cart">Close</button></header>'+
   '<div class="body">'+body+'</div>'+
   (lines.length?'<footer><div class="sum"><div><span>Subtotal</span><span class="mono">'+money(sub)+'</span></div><div><span>Delivery</span><span class="mono">'+(fee?money(fee):'Free')+'</span></div><div class="total"><span>Total</span><span class="mono">'+money(sub+fee)+'</span></div></div>'+
   (fee?'<p class="hint">Add '+money(1000-sub)+' more for free delivery.</p>':'')+
   '<button class="btn primary" data-act="checkout">Checkout</button></footer>':'')+'</aside>';
}
function refreshCart(){
  var b=$('#cartBadge'); if(b) b.textContent=cartCount();
  if(view==='shop') renderGrid();
  renderCart();
}
function setQty(id,q){
  var p=prod(id); if(!p) return;
  if(q>p.stock){q=p.stock;toast('Only '+qtyFmt(p.stock)+' '+p.unit+' in stock.');}
  var i=-1; S.cart.forEach(function(c,k){if(c.id===id)i=k;});
  if(q<=0){if(i>-1)S.cart.splice(i,1);} else if(i>-1) S.cart[i].qty=q; else S.cart.push({id:id,qty:q});
  save(); refreshCart();
}

/* layers */
function openCart(){var d=$('#drawer');d.hidden=false;renderCart();}
function closeCart(){$('#drawer').hidden=true;}
function openModal(html){var m=$('#modal');m.innerHTML='<div class="scrim" data-act="close-modal"></div><div class="dialog" role="dialog" aria-modal="true">'+html+'</div>';m.hidden=false;var f=m.querySelector('input,select,textarea');if(f)f.focus();}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(!$('#drawer').hidden)closeCart();}});

/* auth */
function openAuth(mode,msg){
  var reg=mode==='register';
  openModal('<header><h2>'+(reg?'Create an account':'Log in')+'</h2><button class="btn small" data-act="close-modal">Close</button></header><div class="body">'+
   (msg?'<p class="note">'+esc(msg)+'</p>':'')+
   '<div class="seg"><button data-act="auth-mode" data-id="login" aria-pressed="'+!reg+'">Log in</button><button data-act="auth-mode" data-id="register" aria-pressed="'+reg+'">Register</button></div>'+
   '<form class="form" data-form="auth" data-mode="'+mode+'" novalidate>'+
   (reg?'<div class="field"><label for="a-name">Full name</label><input type="text" id="a-name" autocomplete="name"></div>':'')+
   '<div class="field"><label for="a-email">Email</label><input type="email" id="a-email" autocomplete="email"></div>'+
   '<div class="field"><label for="a-pass">Password</label><input type="password" id="a-pass" autocomplete="'+(reg?'new-password':'current-password')+'"></div>'+
   '<p class="err" id="a-err" role="alert"></p><button class="btn primary" type="submit">'+(reg?'Create account':'Log in')+'</button></form>'+
   '<p class="hint">Demo logins: customer@organicfood.demo / customer123 or admin@organicfood.demo / admin123. Accounts live in this browser only.</p></div>');
}
function afterAuth(){
  closeModal(); renderAll();
  var f=afterLogin; afterLogin=null; if(f) f();
}
function authSubmit(form){
  var mode=form.dataset.mode, email=$('#a-email').value.trim().toLowerCase(), pass=$('#a-pass').value, err=$('#a-err');
  if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent='Enter a valid email address.';return;}
  if(mode==='register'){
    var name=$('#a-name').value.trim();
    if(name.length<2){err.textContent='Enter your name.';return;}
    if(pass.length<6){err.textContent='Use a password of at least 6 characters.';return;}
    if(S.users.some(function(u){return u.email===email;})){err.textContent='That email already has an account. Log in instead.';return;}
    var u={id:'u'+Date.now(),name:name,email:email,pass:pass,role:'customer',phone:'',address:''};
    S.users.push(u);S.session=u.id;save();toast('Account created. Welcome, '+name.split(' ')[0]+'.');afterAuth();
  } else {
    var f=S.users.filter(function(x){return x.email===email&&x.pass===pass;})[0];
    if(!f){err.textContent='Email or password is incorrect.';return;}
    S.session=f.id;save();toast('Logged in as '+f.name+'.');afterAuth();
  }
}

  openModal('<header><h2>Checkout</h2><button class="btn small" data-act="close-modal">Close</button></header><div class="body"><form class="form" data-form="checkout" novalidate>'+
   '<div class="row2"><div class="field"><label for="c-name">Name</label><input type="text" id="c-name" value="'+esc(u.name)+'"></div><div class="field"><label for="c-phone">Mobile</label><input type="tel" id="c-phone" placeholder="01XXXXXXXXX" value="'+esc(u.phone)+'"></div></div>'+
   '<div class="field"><label for="c-addr">Delivery address</label><textarea id="c-addr">'+esc(u.address)+'</textarea></div>'+
   '<div class="field"><span class="label">Payment</span>'+
   '<label class="radio"><input type="radio" name="pay" value="Cash on delivery" checked><span><b>Cash on delivery</b><br><span class="hint">Pay the rider when the order arrives.</span></span></label>'+
   '<label class="radio"><input type="radio" name="pay" value="bKash on delivery"><span><b>bKash on delivery</b><br><span class="hint">Send the amount to the rider\'s number at the door.</span></span></label></div>'+
   '<div class="field"><label for="c-note">Note (optional)</label><input type="text" id="c-note" placeholder="Ring the bell twice"></div>'+
   '<div class="sum"><div><span>Subtotal</span><span class="mono">'+money(sub)+'</span></div><div><span>Delivery</span><span class="mono">'+(fee?money(fee):'Free')+'</span></div><div class="total"><span>Total</span><span class="mono">'+money(sub+fee)+'</span></div></div>'+
   '<p class="err" id="c-err" role="alert"></p><button class="btn primary" type="submit">Place order</button></form></div>');
}
function checkoutSubmit(form){
  var u=me(), err=$('#c-err');
  var name=$('#c-name').value.trim(), phone=$('#c-phone').value.replace(/[\s-]/g,''), addr=$('#c-addr').value.trim(), note=$('#c-note').value.trim();
  var pay=form.querySelector('input[name=pay]:checked').value;
  if(name.length<2){err.textContent='Enter the name for delivery.';return;}
  if(!/^01[3-9]\d{8}$/.test(phone)){err.textContent='Enter a Bangladesh mobile number like 01712345678.';return;}
  if(addr.length<8){err.textContent='Enter a full delivery address.';return;}
  var items=[];
  for(var i=0;i<S.cart.length;i++){
    var c=S.cart[i], p=prod(c.id);
    if(!p||p.stock<c.qty){err.textContent=(p?p.name:'An item')+' is no longer available in that quantity. Update your cart.';return;}
    items.push({id:p.id,name:p.name,unit:p.unit,price:p.price,qty:c.qty});
  }
  if(!items.length){err.textContent='Your cart is empty.';return;}
  items.forEach(function(it){var p=prod(it.id);p.stock-=it.qty;});
  var sub=cartSub(), fee=feeFor(sub);
  var o={id:'OF-'+String(S.nextOrder++).padStart(4,'0'),userId:u.id,created:new Date().toISOString(),status:'Pending',items:items,sub:sub,fee:fee,total:sub+fee,pay:pay,name:name,phone:phone,address:addr,note:note,sample:false};
  S.orders.push(o); u.phone=phone; u.address=addr; S.cart=[]; save();
  closeModal(); closeCart(); view='orders'; renderAll(); window.scrollTo(0,0);
  toast('Order '+o.id+' placed. We will confirm it shortly.');
}

/* orders */
function orderCard(o,admin){
  var idx=FLOW.indexOf(o.status);
  var items=o.items.map(function(i){return '<div><span>'+esc(i.name)+' × '+qtyFmt(i.qty)+' '+esc(i.unit)+'</span><span class="mono">'+money(i.price*i.qty)+'</span></div>';}).join('');
  var flow=o.status==='Cancelled'?'<p class="hint">This order was cancelled.</p>':'<ul class="flow" aria-label="Order progress">'+FLOW.map(function(s,k){return '<li class="'+(k<=idx?'done':'')+'">'+esc(s)+'</li>';}).join('')+'</ul>';
  return '<article class="order"><div class="ohead"><h3 class="mono">'+esc(o.id)+(o.sample?' <span class="tag">sample</span>':'')+'</h3><span class="muted">'+fmtDate(o.created)+'</span>'+pill(o.status)+'</div>'+
   flow+'<div class="items">'+items+'<div><span class="muted">Delivery</span><span class="mono">'+(o.fee?money(o.fee):'Free')+'</span></div><div><b>Total</b><b class="mono">'+money(o.total)+'</b></div></div>'+
   '<p class="hint">'+esc(o.pay)+' · '+esc(o.address)+'</p>'+
   (o.status==='Pending'?'<div><button class="btn small danger" data-act="cancel" data-id="'+o.id+'">Cancel order</button></div>':'')+'</article>';
}
function renderOrders(){
  var u=me();
  if(!u){$('#main').innerHTML='<div class="empty"><h3>Log in to see your orders</h3><p>Your orders and their delivery status appear here.</p><button class="btn primary" data-act="login">Log in</button></div>';return;}
  var list=S.orders.filter(function(o){return o.userId===u.id;}).sort(function(a,b){return new Date(b.created)-new Date(a.created);});
  $('#main').innerHTML='<div class="pagehead"><h2>My orders</h2></div>'+(list.length?'<div class="orders">'+list.map(function(o){return orderCard(o);}).join('')+'</div>':'<div class="empty"><h3>No orders yet</h3><p>Your first order will show up here with live status.</p><button class="btn primary" data-act="nav" data-v="shop">Start shopping</button></div>');
}
function restock(o,dir){o.items.forEach(function(i){var p=prod(i.id);if(p){p.stock=Math.max(0,p.stock+dir*i.qty);}});}
function setStatus(o,st){
  if(o.status===st) return;
  if(st==='Cancelled') restock(o,1);
  else if(o.status==='Cancelled') restock(o,-1);
  o.status=st; save();
}

/* admin */
function renderAdmin(){
  if(!isAdmin()){view='shop';renderAll();return;}
  var tabs=[['overview','Overview'],['products','Products'],['orders','Orders']];
  var h='<div class="pagehead"><h2>Admin dashboard</h2><div class="seg" role="tablist">'+tabs.map(function(t){return '<button data-act="admin-tab" data-id="'+t[0]+'" aria-pressed="'+(adminTab===t[0])+'">'+t[1]+'</button>';}).join('')+'</div></div>';
  if(adminTab==='overview'){
    var live=S.orders.filter(function(o){return o.status!=='Cancelled';});
    var rev=live.reduce(function(a,o){return a+o.total;},0);
    var pend=S.orders.filter(function(o){return o.status==='Pending';}).length;
    var low=S.products.filter(function(p){return p.stock<=10;}).sort(function(a,b){return a.stock-b.stock;});
    var counts=FLOW.concat(['Cancelled']).map(function(s){return [s,S.orders.filter(function(o){return o.status===s;}).length];});
    var mx=Math.max.apply(null,counts.map(function(c){return c[1];}).concat([1]));
    h+='<div class="stats"><div class="stat"><div class="k">Orders</div><div class="v">'+S.orders.length+'</div></div><div class="stat"><div class="k">Awaiting confirmation</div><div class="v">'+pend+'</div></div><div class="stat"><div class="k">Order value (excl. cancelled)</div><div class="v">'+money(rev)+'</div></div><div class="stat"><div class="k">Products</div><div class="v">'+S.products.length+'</div></div></div>'+
     '<div class="cols"><div class="box"><h3>Orders by status</h3><div class="bars">'+counts.map(function(c){return '<div class="bar'+(c[0]==='Cancelled'?' cancelled':'')+'"><span>'+esc(c[0])+'</span><div class="trk"><i style="width:'+(c[1]/mx*100)+'%;min-width:'+(c[1]?'10px':'0')+'"></i></div><b class="mono">'+c[1]+'</b></div>';}).join('')+'</div></div>'+
     '<div class="box"><h3>Low or out of stock</h3>'+(low.length?'<div class="items">'+low.map(function(p){return '<div><span>'+esc(p.name)+' <span class="bn">'+esc(p.bn)+'</span></span><span class="'+(p.stock<=0?'pill bad':'pill warn')+'">'+(p.stock<=0?'Out':qtyFmt(p.stock)+' '+esc(p.unit))+'</span></div>';}).join('')+'</div>':'<p class="hint">Every product has healthy stock.</p>')+'</div></div>';
  } else if(adminTab==='products'){
    h+='<div class="pagehead"><span class="muted">'+S.products.length+' products</span><button class="btn primary" data-act="prod-new">Add product</button></div>'+
     '<div class="scroll"><table><thead><tr><th>Product</th><th>Category</th><th class="num">Price</th><th class="num">Stock</th><th>Origin</th><th></th></tr></thead><tbody>'+
     S.products.map(function(p){return '<tr><td><b>'+esc(p.name)+'</b> <span class="bn">'+esc(p.bn)+'</span></td><td>'+esc(p.cat)+'</td><td class="num">'+money(p.price)+' / '+esc(p.unit)+'</td><td class="num">'+qtyFmt(p.stock)+'</td><td>'+esc(p.origin)+'</td><td><button class="btn small" data-act="prod-edit" data-id="'+p.id+'">Edit</button> <button class="btn small danger'+(pendingDelete===p.id?' armed':'')+'" data-act="prod-del" data-id="'+p.id+'">'+(pendingDelete===p.id?'Confirm delete':'Delete')+'</button></td></tr>';}).join('')+'</tbody></table></div>';
  } else {
    var all=S.orders.slice().sort(function(a,b){return new Date(b.created)-new Date(a.created);});
    h+='<div class="scroll"><table><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th class="num">Items</th><th class="num">Total</th><th>Payment</th><th>Status</th></tr></thead><tbody>'+
     all.map(function(o){return '<tr><td class="mono">'+esc(o.id)+(o.sample?' <span class="tag">sample</span>':'')+'</td><td>'+esc(o.name)+'</td><td>'+fmtDate(o.created)+'</td><td class="num">'+o.items.length+'</td><td class="num">'+money(o.total)+'</td><td>'+esc(o.pay)+'</td><td><select data-change="status" data-id="'+o.id+'" aria-label="Status of '+esc(o.id)+'">'+FLOW.concat(['Cancelled']).map(function(s){return '<option'+(s===o.status?' selected':'')+'>'+s+'</option>';}).join('')+'</select></td></tr>';}).join('')+'</tbody></table></div>';
  }
  $('#main').innerHTML=h;
}

  openModal('<header><h2>'+(id?'Edit product':'Add product')+'</h2><button class="btn small" data-act="close-modal">Close</button></header><div class="body"><form class="form" data-form="product" data-id="'+(id||'')+'" novalidate>'+
   '<div class="row2"><div class="field"><label for="p-name">Name</label><input type="text" id="p-name" value="'+esc(p.name)+'"></div><div class="field"><label for="p-bn">Name in Bangla</label><input type="text" id="p-bn" value="'+esc(p.bn)+'"></div></div>'+
   '<div class="row2"><div class="field"><label for="p-cat">Category</label><select id="p-cat">'+CATS.map(function(c){return '<option'+(c===p.cat?' selected':'')+'>'+esc(c)+'</option>';}).join('')+'</select></div><div class="field"><label for="p-unit">Sold per</label><select id="p-unit">'+['kg','litre','dozen','piece','bunch'].map(function(c){return '<option'+(c===p.unit?' selected':'')+'>'+c+'</option>';}).join('')+'</select></div></div>'+
   '<div class="row2"><div class="field"><label for="p-price">Price (৳)</label><input type="number" id="p-price" min="1" step="1" value="'+esc(p.price)+'"></div><div class="field"><label for="p-stock">Stock</label><input type="number" id="p-stock" min="0" step="0.5" value="'+esc(p.stock)+'"></div></div>'+
   '<div class="row2"><div class="field"><label for="p-origin">Farm district</label><input type="text" id="p-origin" value="'+esc(p.origin)+'"></div><div class="field"><label for="p-age">Harvested (days ago)</label><input type="number" id="p-age" min="0" step="1" value="'+esc(p.age)+'"></div></div>'+
   '<p class="err" id="p-err" role="alert"></p><button class="btn primary" type="submit">'+(id?'Save changes':'Add product')+'</button></form></div>');
}
function productSubmit(form){
  var id=form.dataset.id, err=$('#p-err');
  var d={name:$('#p-name').value.trim(),bn:$('#p-bn').value.trim(),cat:$('#p-cat').value,unit:$('#p-unit').value,price:parseFloat($('#p-price').value),stock:parseFloat($('#p-stock').value),origin:$('#p-origin').value.trim(),age:parseInt($('#p-age').value,10)};
  if(d.name.length<2){err.textContent='Enter a product name.';return;}
  if(!(d.price>0)){err.textContent='Enter a price above 0.';return;}
  if(!(d.stock>=0)){err.textContent='Enter the stock on hand.';return;}
  if(!d.origin){err.textContent='Enter the farm district.';return;}
  if(!(d.age>=0)) d.age=0;
  if(id){var p=prod(id);Object.keys(d).forEach(function(k){p[k]=d[k];});toast('Product updated.');}
  else{d.id='p'+Date.now();S.products.push(d);toast('Product added.');}
  save();closeModal();renderAll();
}

/* render */
function renderAll(){
  renderHeader();
  if(view==='shop') renderShop(); else if(view==='orders') renderOrders(); else if(view==='admin') renderAdmin();
  renderCart();
}

/* events */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var a=t.dataset.act, id=t.dataset.id, p;
  if(a==='nav'){
    var v=t.dataset.v;
    if(v==='orders'&&!me()){afterLogin=function(){view='orders';renderAll();};openAuth('login','Log in to see your orders.');return;}
    if(v==='admin'&&!isAdmin()) return;
    view=v;pendingDelete=null;closeCart();closeModal();renderAll();window.scrollTo(0,0);
  }
  else if(a==='cat'){filt.cat=id;renderShop();}
  else if(a==='clear'){filt.cat='All';filt.q='';renderShop();}
  else if(a==='inc'){p=prod(id);if(p)setQty(id,cartQty(id)+stepOf(p));}
  else if(a==='dec'){p=prod(id);if(p)setQty(id,cartQty(id)-stepOf(p));}
  else if(a==='rm'){setQty(id,0);}
  else if(a==='cart-open'){openCart();}
  else if(a==='close-cart'){closeCart();}
  else if(a==='close-modal'){closeModal();}
  else if(a==='login'){openAuth('login');}
  else if(a==='auth-mode'){openAuth(id);}
  else if(a==='logout'){S.session=null;save();if(view!=='shop')view='shop';closeCart();renderAll();toast('Logged out.');}
  else if(a==='checkout'){
    if(!me()){afterLogin=function(){openCart();};closeCart();openAuth('login','Log in or register to place your order. Your cart is saved.');return;}
    closeCart();openCheckout();
  }
  else if(a==='cancel'){var o=S.orders.filter(function(x){return x.id===id;})[0];if(o&&o.status==='Pending'){setStatus(o,'Cancelled');renderOrders();toast('Order '+id+' cancelled.');}}
  else if(a==='admin-tab'){adminTab=id;pendingDelete=null;renderAdmin();}
  else if(a==='prod-new'){openProduct('');}
  else if(a==='prod-edit'){openProduct(id);}
  else if(a==='prod-del'){
    if(pendingDelete===id){S.products=S.products.filter(function(x){return x.id!==id;});S.cart=S.cart.filter(function(c){return c.id!==id;});pendingDelete=null;save();toast('Product deleted.');renderAll();}
    else{pendingDelete=id;renderAdmin();}
  }
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  var k=f.dataset.form;
  if(k==='auth') authSubmit(f); else if(k==='checkout') checkoutSubmit(f); else if(k==='product') productSubmit(f);
});
document.addEventListener('input',function(e){if(e.target.id==='q'){filt.q=e.target.value;renderGrid();}});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='sort'){filt.sort=t.value;renderGrid();}
  else if(t.dataset&&t.dataset.change==='status'){
    var o=S.orders.filter(function(x){return x.id===t.dataset.id;})[0];
    if(o){setStatus(o,t.value);toast(o.id+' is now '+t.value+'.');renderAdmin();}
  }
});

renderAll();
})();
</script>
</body>
</html>
